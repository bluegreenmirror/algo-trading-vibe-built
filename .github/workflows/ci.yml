name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            algo-bot-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests (pytest)
        run: docker run --rm --entrypoint pytest algo-bot-ci:${{ github.sha }} -q

      - name: Ruff (lint)
        run: docker run --rm --entrypoint ruff algo-bot-ci:${{ github.sha }} check .

      - name: Black (format check)
        run: docker run --rm --entrypoint black algo-bot-ci:${{ github.sha }} --check .

  security-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (reuse cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            algo-bot-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'algo-bot-ci:${{ github.sha }}'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'